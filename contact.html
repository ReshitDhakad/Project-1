<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Hello, World!</title>
    <style>
      :root { color-scheme:dark; --ink:#f6f3ff; --muted:#c5c1dc; --accent:#f8a4d5; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 86% 15%,#59336d 0,transparent 30rem),radial-gradient(circle at 13% 83%,#164f65 0,transparent 28rem),#0b0d20; }
      nav { width:min(92vw,1000px); margin:0 auto; padding:1.6rem 0; display:flex; justify-content:space-between; align-items:center; }
      .brand { color:var(--ink); font-weight:800; letter-spacing:-.04em; text-decoration:none; }.links { display:flex; gap:.65rem; }.links a { color:var(--muted); text-decoration:none; padding:.45rem .75rem; border:1px solid rgba(255,255,255,.13); border-radius:999px; font-size:.85rem; }.links a:hover,.links a[aria-current="page"] { color:var(--ink); background:rgba(255,255,255,.1); }
      main { width:min(92vw,680px); margin:clamp(3rem,8vh,6rem) auto; padding:clamp(1.5rem,5vw,3.5rem); border:1px solid rgba(255,255,255,.16); border-radius:28px; background:rgba(255,255,255,.07); box-shadow:0 25px 70px rgba(0,0,0,.32); backdrop-filter:blur(16px); }
      .label { color:var(--accent); font-size:.78rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }h1 { margin:.65rem 0 .7rem; font-size:clamp(3rem,8vw,5.6rem); line-height:.95; letter-spacing:-.07em; }p { color:var(--muted); line-height:1.7; }
      form { display:grid; gap:1rem; margin-top:2rem; }label { display:grid; gap:.42rem; color:#e4e0f3; font-size:.88rem; font-weight:700; }input,textarea { width:100%; padding:.85rem 1rem; border:1px solid rgba(255,255,255,.16); border-radius:12px; outline:none; color:var(--ink); font:inherit; background:rgba(7,9,27,.5); }input:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(248,164,213,.15); }textarea { min-height:8rem; resize:vertical; }button { justify-self:start; padding:.8rem 1.2rem; border:0; border-radius:12px; background:linear-gradient(110deg,#f59acb,#a78bfa); color:#241126; font:800 .92rem inherit; cursor:pointer; }button:hover { filter:brightness(1.1); }
    </style>
  </head>
  <body>
    <nav><a class="brand" href="index.html">hello.world</a><div class="links"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></div></nav>
    <main><div class="label">Get in touch</div><h1>Say hello.</h1><p>Have an idea, a question, or just a friendly wave? Leave a note below.</p><form><label>Name<input type="text" placeholder="Your name" /></label><label>Email<input type="email" placeholder="you@example.com" /></label><label>Message<textarea placeholder="What is on your mind?"></textarea></label><button type="button">Send message →</button></form></main>
  </body>
</html>
