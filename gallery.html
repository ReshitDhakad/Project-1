<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Hello, World!</title>
    <style>
      :root { color-scheme: dark; --ink: #f6f3ff; --muted: #c5c1dc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: radial-gradient(circle at 15% 12%, #384482 0, transparent 29rem), radial-gradient(circle at 85% 90%, #573257 0, transparent 33rem), #0b0d20; }
      nav { width: min(92vw, 1100px); margin: 0 auto; padding: 1.6rem 0; display: flex; justify-content: space-between; align-items: center; }
      .brand { color: var(--ink); font-weight: 800; letter-spacing: -.04em; text-decoration: none; }
      .links { display: flex; gap: .65rem; }
      .links a { color: var(--muted); text-decoration: none; padding: .45rem .75rem; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; font-size: .85rem; }
      .links a:hover, .links a[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.1); }
      main { width: min(92vw, 1100px); margin: 3.5rem auto 5rem; }
      .label { color: #8ff7ef; font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: .55rem 0 .5rem; font-size: clamp(3rem, 8vw, 6rem); line-height: .95; letter-spacing: -.07em; }
      .intro { margin: 0 0 2rem; color: var(--muted); font-size: 1.08rem; }
      .grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 150px; gap: 1rem; }
      .tile { position: relative; overflow: hidden; display: flex; align-items: end; padding: 1.35rem; border: 1px solid rgba(255,255,255,.15); border-radius: 22px; color: white; text-decoration: none; background: var(--bg); box-shadow: inset 0 -70px 55px rgba(0,0,0,.25); transition: transform .25s ease, box-shadow .25s ease; }
      .tile:hover { transform: translateY(-6px); box-shadow: inset 0 -70px 55px rgba(0,0,0,.25), 0 18px 35px rgba(0,0,0,.25); }
      .tile::after { content: "↗"; position: absolute; top: 1rem; right: 1rem; width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.15); opacity: 0; transform: translateY(5px); transition: .25s ease; }
      .tile:hover::after { opacity: 1; transform: none; }
      .tile b { font-size: 1.08rem; letter-spacing: -.02em; }
      .wide { grid-column: span 7; grid-row: span 2; } .tall { grid-column: span 5; grid-row: span 3; } .small { grid-column: span 4; grid-row: span 2; } .medium { grid-column: span 8; grid-row: span 2; }
      .aurora { --bg: linear-gradient(135deg, #304873, #a54393 52%, #ec8c62); }.ocean { --bg: linear-gradient(145deg, #18a6b5, #12305a 64%, #08091d); }.sunset { --bg: linear-gradient(145deg, #f8ba62, #d05274 55%, #502d7d); }.mint { --bg: linear-gradient(135deg, #3bdcb6, #256d91 60%, #1f1a5d); }
      @media (max-width: 650px) { nav { align-items: flex-start; gap: .9rem; } .links { flex-wrap: wrap; justify-content: flex-end; } .grid { grid-template-columns: 1fr 1fr; grid-auto-rows: 150px; } .wide, .tall, .small, .medium { grid-column: span 1; grid-row: span 2; } }
    </style>
  </head>
  <body>
    <nav><a class="brand" href="index.html">hello.world</a><div class="links"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></div></nav>
    <main>
      <div class="label">Visual collection</div>
      <h1>Little worlds.</h1>
      <p class="intro">A colorful set of imagined places, gathered in one bright corner.</p>
      <section class="grid" aria-label="Gallery collection">
        <a class="tile wide aurora" href="#aurora"><b>Aurora Signals</b></a>
        <a class="tile tall ocean" href="#ocean"><b>Deep Blue</b></a>
        <a class="tile small sunset" href="#sunset"><b>Golden Hour</b></a>
        <a class="tile medium mint" href="#mint"><b>Electric Garden</b></a>
      </section>
    </main>
  </body>
</html>
